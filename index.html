<!DOCTYPE html>
<html lang="en" class="h-full">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f7f8fa" />
    <title>MKS | Hotel Operations</title>
    <link rel="icon" href="./images/logo/logo.jpeg">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class', theme: {
                extend: {
                    colors: { ink: '#17212b', slate: { 25: '#fbfcfd' }, coral: '#ed684f', mint: '#dff5e8', sea: '#237c78' },
                    fontFamily: { display: ['"Space Grotesk"', 'sans-serif'], body: ['"DM Sans"', 'sans-serif'] },
                    boxShadow: { soft: '0 10px 30px rgba(23,33,43,.07)' }
                }
            }
        };
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap"
        rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script>
    <style>
        body {
            font-family: 'DM Sans', sans-serif;
            background: #f6f7f9;
            color: #17212b;
        }

        .dark body {
            background: #10171d;
            color: #eef2f3;
        }

        .dark .panel,
        .dark .sidebar {
            background: #172129;
            border-color: #263740;
        }

        .dark .muted,
        .dark input,
        .dark select,
        .dark textarea {
            color: #a9b9bf;
        }

        .dark input,
        .dark select,
        .dark textarea {
            background: #1c2a32;
            border-color: #334752;
        }

        .dark .soft-bg {
            background: #203039;
        }

        .panel {
            background: #fff;
            border: 1px solid #e7ebee;
            border-radius: 14px;
            box-shadow: 0 8px 26px rgba(23, 33, 43, .045);
        }

        .sidebar {
            background: #fff;
            border-right: 1px solid #e7ebee;
        }

        .nav-active {
            background: #e7f6ef;
            color: #24755f;
            font-weight: 700;
        }

        .dark .nav-active {
            background: #24453d;
            color: #9ce2bd;
        }

        .btn-primary {
            background: #e86b52;
            color: white;
            box-shadow: 0 5px 12px rgba(232, 107, 82, .2);
        }

        .btn-primary:hover {
            background: #d85b43;
        }

        .btn-soft {
            background: #eef8f2;
            color: #24755f;
        }

        .dark .btn-soft {
            background: #25443c;
            color: #9ce2bd;
        }

        input,
        select,
        textarea {
            outline: none;
            border: 1px solid #dce3e7;
            border-radius: 9px;
            padding: 9px 11px;
            font-size: 13px;
            width: 100%;
            background: white;
            color: #17212b;
        }

        input:focus,
        select:focus,
        textarea:focus {
            border-color: #6dbb9b;
            box-shadow: 0 0 0 3px rgba(109, 187, 155, .13);
        }

        .tab-active {
            color: #d85b43;
            border-bottom: 2px solid #e86b52;
            font-weight: 700;
        }

        .menu-item {
            transition: transform .15s, border-color .15s;
        }

        .menu-item:active {
            transform: scale(.97);
        }

        .menu-photo {
            width: 100%;
            height: 112px;
            object-fit: cover;
            object-position: center;
            border-radius: 9px;
            margin-bottom: 12px;
        }

        .hide {
            display: none !important;
        }

        @media print {
            body * {
                visibility: hidden;
            }

            #receipt,
            #receipt * {
                visibility: visible;
            }

            #receipt {
                position: absolute;
                left: 0;
                top: 0;
                width: 80mm;
                box-shadow: none;
            }
        }
    </style>
</head>

<body class="h-full">
    <div id="app" class="min-h-full flex">
        <aside class="sidebar w-64 shrink-0 hidden lg:flex flex-col p-5 fixed inset-y-0 z-20">
            <div class="flex items-center gap-3 mb-9">
                <img src="images/logo/logo.jpeg" alt="MKS logo" class="w-10 h-10 rounded-xl object-cover">
                <div>
                    <div class="font-display font-bold text-lg tracking-tight">MKS</div>
                    <div class="text-[10px] uppercase tracking-[.18em] text-slate-400">hotel & restaurant</div>
                </div>
            </div>
            <div class="text-[10px] text-slate-400 uppercase tracking-[.18em] mb-3">Workspace</div>
            <nav id="nav" class="space-y-1">
                <button data-view="dashboard"
                    class="nav-btn nav-active w-full flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm"><i
                        data-lucide="layout-dashboard" class="w-4 h-4"></i>Overview</button>
                <button data-view="billing"
                    class="nav-btn w-full flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm text-slate-500"><i
                        data-lucide="receipt" class="w-4 h-4"></i>POS & Billing</button>
                <button data-view="inventory"
                    class="nav-btn w-full flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm text-slate-500"><i
                        data-lucide="boxes" class="w-4 h-4"></i>Godown Stock</button>
                <button data-view="bookings"
                    class="nav-btn w-full flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm text-slate-500"><i
                        data-lucide="calendar-days" class="w-4 h-4"></i>Advance Bookings</button>
                <button data-view="expenses"
                    class="nav-btn w-full flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm text-slate-500"><i
                        data-lucide="wallet-cards" class="w-4 h-4"></i>Expenses</button>
            </nav>
            <div class="mt-auto space-y-1"><button id="exportBtn"
                    class="w-full flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm text-slate-500 hover:bg-slate-50"><i
                        data-lucide="download" class="w-4 h-4"></i>Export Excel</button><label
                    class="w-full flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm text-slate-500 hover:bg-slate-50 cursor-pointer"><i
                        data-lucide="upload" class="w-4 h-4"></i>Import Backup<input id="importInput" type="file"
                        accept=".xlsx" class="hidden"></label><button id="settingsBtn"
                    class="w-full flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm text-slate-500 hover:bg-slate-50"><i
                        data-lucide="settings-2" class="w-4 h-4"></i>Settings</button></div>
        </aside>
        <main class="lg:ml-64 flex-1 min-w-0">
            <header
                class="h-16 border-b border-slate-200/80 dark:border-slate-700 px-5 md:px-8 flex items-center justify-between bg-white/75 dark:bg-[#172129]/80 backdrop-blur sticky top-0 z-10">
                <div class="flex items-center gap-3"><button id="mobileMenu"
                        class="lg:hidden p-2 rounded-lg hover:bg-slate-100"><i data-lucide="menu"
                            class="w-5 h-5"></i></button>
                    <div id="pageTitle" class="font-display text-xl font-bold">Overview</div>
                </div>
                <div class="flex items-center gap-2"><span id="saveState"
                        class="text-xs text-slate-400 hidden sm:inline-flex items-center gap-1"><i data-lucide="cloud"
                            class="w-3.5 h-3.5"></i> Google Sheets</span><button id="themeBtn" title="Toggle dark mode"
                        class="p-2 rounded-lg hover:bg-slate-100 dark:hover:bg-slate-700"><i data-lucide="moon"
                            class="w-4 h-4"></i></button>
                    <div
                        class="w-8 h-8 rounded-full bg-[#dff5e8] text-[#24755f] grid place-items-center font-bold text-xs">
                        MKS</div>
                </div>
            </header>
            <div id="mobileNav" class="hide lg:hidden p-3 border-b bg-white dark:bg-[#172129] flex gap-2 overflow-auto">
            </div>
            <div class="p-5 md:p-8 max-w-[1500px] mx-auto" id="content"></div>
        </main>
    </div>
    <div id="modalRoot"></div>
    <script>
        const seedMenu = [{ id: 'm1', name: 'Fresh Lime Soda', category: 'Juices', price: 80, emoji: '🍋' }, { id: 'm2', name: 'Mango Lassi', category: 'Juices', price: 120, emoji: '🥭' }, { id: 'm3', name: 'Masala Dosa', category: 'Tiffin', price: 140, emoji: '🥞' }, { id: 'm4', name: 'Idli Sambar', category: 'Tiffin', price: 90, emoji: '🍚' }, { id: 'm5', name: 'Chicken Biryani', category: 'Dinner', price: 280, emoji: '🍛' }, { id: 'm6', name: 'Paneer Butter Masala', category: 'Dinner', price: 220, emoji: '🥘' }, { id: 'm7', name: 'Filter Coffee', category: 'Beverages', price: 45, emoji: '☕' }, { id: 'm8', name: 'Chai', category: 'Beverages', price: 35, emoji: '🫖' }, { id: 'm9', name: 'Gobi 65', category: 'Snacks', price: 160, emoji: '🥦' }, { id: 'm10', name: 'French Fries', category: 'Snacks', price: 110, emoji: '🍟' }];
        const photoMenu = [{ id: 'photo-juice-lemon', name: 'Lemon Juice', category: 'Juices', price: 20, image: 'images/menu/menucard 4.jpeg' }, { id: 'photo-juice-apple', name: 'Apple Juice', category: 'Juices', price: 60, image: 'images/menu/menucard 4.jpeg' }, { id: 'photo-juice-pineapple', name: 'Pineapple Juice', category: 'Juices', price: 40, image: 'images/menu/menucard 4.jpeg' }, { id: 'photo-juice-orange', name: 'Orange Juice', category: 'Juices', price: 60, image: 'images/menu/menucard 4.jpeg' }, { id: 'photo-shake-apple', name: 'Apple Shake', category: 'Beverages', price: 70, image: 'images/menu/menucard 3.jpeg' }, { id: 'photo-shake-apple-ice', name: 'Apple Shake with Ice Cream', category: 'Beverages', price: 100, image: 'images/menu/menucard 3.jpeg' }, { id: 'photo-shake-pomegranate', name: 'Pomegranate Shake', category: 'Beverages', price: 80, image: 'images/menu/menucard 3.jpeg' }, { id: 'photo-shake-sapota', name: 'Sapota Shake', category: 'Beverages', price: 60, image: 'images/menu/menucard 3.jpeg' }, { id: 'photo-shake-mango', name: 'Mango Shake', category: 'Beverages', price: 70, image: 'images/menu/menucard 3.jpeg' }, { id: 'photo-shake-pineapple', name: 'Pineapple Shake', category: 'Beverages', price: 60, image: 'images/menu/menucard 3.jpeg' }, { id: 'photo-shake-badam', name: 'Badam Shake with Ice Cream', category: 'Beverages', price: 100, image: 'images/menu/menucard 3.jpeg' }, { id: 'photo-shake-vanilla', name: 'Vanilla Shake with Ice Cream', category: 'Beverages', price: 100, image: 'images/menu/menucard 3.jpeg' }, { id: 'photo-shake-strawberry', name: 'Strawberry Shake with Ice Cream', category: 'Beverages', price: 100, image: 'images/menu/menucard 3.jpeg' }, { id: 'photo-milk-rose', name: 'Rose Milk', category: 'Beverages', price: 40, image: 'images/menu/menucard 2.jpeg' }, { id: 'photo-milk-chocolate', name: 'Chocolate Milk', category: 'Beverages', price: 40, image: 'images/menu/menucard 2.jpeg' }, { id: 'photo-milk-strawberry', name: 'Strawberry Milk', category: 'Beverages', price: 40, image: 'images/menu/menucard 2.jpeg' }, { id: 'photo-milk-badam', name: 'Badam Milk', category: 'Beverages', price: 40, image: 'images/menu/menucard 2.jpeg' }, { id: 'photo-falooda-medium', name: 'Medium Falooda', category: 'Beverages', price: 110, image: 'images/menu/menucard 2.jpeg' }, { id: 'photo-falooda-royal', name: 'Royal Falooda', category: 'Beverages', price: 200, image: 'images/menu/menucard 2.jpeg' }, { id: 'photo-lassi', name: 'Lassi', category: 'Beverages', price: 50, image: 'images/menu/menucard 2.jpeg' }, { id: 'photo-lassi-strawberry', name: 'Strawberry Lassi', category: 'Beverages', price: 70, image: 'images/menu/menucard 2.jpeg' }, { id: 'photo-lassi-badam', name: 'Badam Lassi', category: 'Beverages', price: 80, image: 'images/menu/menucard 2.jpeg' }, { id: 'photo-lassi-pista', name: 'Pista Lassi', category: 'Beverages', price: 80, image: 'images/menu/menucard 2.jpeg' }, { id: 'photo-lassi-mango', name: 'Mango Lassi', category: 'Beverages', price: 70, image: 'images/menu/menucard 2.jpeg' }, { id: 'photo-lassi-chocolate', name: 'Chocolate Lassi', category: 'Beverages', price: 70, image: 'images/menu/menucard 2.jpeg' }, { id: 'photo-mojito-lemon', name: 'Lemon Mint Mojito', category: 'Beverages', price: 60, image: 'images/menu/menucard 1.jpeg' }, { id: 'photo-mojito-blue', name: 'Blue Curacao Mojito', category: 'Beverages', price: 60, image: 'images/menu/menucard 1.jpeg' }, { id: 'photo-mojito-watermelon', name: 'Watermelon Mojito', category: 'Beverages', price: 60, image: 'images/menu/menucard 1.jpeg' }, { id: 'photo-mojito-strawberry', name: 'Strawberry Mojito', category: 'Beverages', price: 60, image: 'images/menu/menucard 1.jpeg' }, { id: 'photo-mojito-greenapple', name: 'Green Apple Mojito', category: 'Beverages', price: 60, image: 'images/menu/menucard 1.jpeg' }, { id: 'photo-ice-vanilla', name: 'Vanilla Ice Cream', category: 'Snacks', price: 30, image: 'images/menu/menucard 1.jpeg' }, { id: 'photo-ice-strawberry', name: 'Strawberry Ice Cream', category: 'Snacks', price: 30, image: 'images/menu/menucard 1.jpeg' }, { id: 'photo-ice-chocolate', name: 'Chocolate Ice Cream', category: 'Snacks', price: 50, image: 'images/menu/menucard 1.jpeg' }, { id: 'photo-ice-pista', name: 'Pista Ice Cream', category: 'Snacks', price: 60, image: 'images/menu/menucard 1.jpeg' }, { id: 'photo-ice-butterscotch', name: 'Butterscotch Ice Cream', category: 'Snacks', price: 50, image: 'images/menu/menucard 1.jpeg' }, { id: 'photo-ice-mango', name: 'Mango Ice Cream', category: 'Snacks', price: 50, image: 'images/menu/menucard 1.jpeg' }, { id: 'photo-hot-badam', name: 'Badam Hot Milk', category: 'Beverages', price: 20, image: 'images/menu/menucard 1.jpeg' }, { id: 'photo-hot-horlicks', name: 'Horlicks Hot Milk', category: 'Beverages', price: 20, image: 'images/menu/menucard 1.jpeg' }, { id: 'photo-hot-boost', name: 'Boost Hot Milk', category: 'Beverages', price: 20, image: 'images/menu/menucard 1.jpeg' }];
        const seedInventory = [{ id: 'i1', name: 'Basmati Rice', category: 'Grains', unit: 'kg', godown: 42, kitchen: 8, threshold: 15, cost: 110 }, { id: 'i2', name: 'Cooking Oil', category: 'Grocery', unit: 'ltr', godown: 28, kitchen: 6, threshold: 10, cost: 145 }, { id: 'i3', name: 'Chicken', category: 'Meat', unit: 'kg', godown: 18, kitchen: 4, threshold: 5, cost: 260 }, { id: 'i4', name: 'Fresh Milk', category: 'Dairy', unit: 'ltr', godown: 25, kitchen: 3, threshold: 8, cost: 62 }, { id: 'i5', name: 'LPG Cylinder', category: 'Fuel', unit: 'pcs', godown: 4, kitchen: 1, threshold: 2, cost: 1900 }];
        const SHEET_WEBHOOK = 'https://script.google.com/macros/s/AKfycbwVTctw2435079qGCYe29GVJHEbT10uQZ_0WVhZ7jVNFbjFZJ2XeuG5gItl30bHlT93pg/exec';
        const OLD_SHEET_WEBHOOK = 'https://script.google.com/macros/s/AKfycbzgPBtDQUCRL0L6kXO3dvHBTXiDKk6rU9z1AGRU-b8xagwoZ-iDDb-zfukwIUV9UTwJig/exec';
        const db = { menu: [...seedMenu, ...photoMenu], inventory: seedInventory, bills: [], bookings: [], expenses: [], settings: { webhook: SHEET_WEBHOOK } }; const savedSettings = localStorage.getItem('ledgerly-settings'); if (savedSettings) db.settings = { ...db.settings, ...JSON.parse(savedSettings), webhook: JSON.parse(savedSettings).webhook === OLD_SHEET_WEBHOOK ? SHEET_WEBHOOK : JSON.parse(savedSettings).webhook }; localStorage.setItem('ledgerly-settings', JSON.stringify(db.settings)); let cart = [], currentView = 'dashboard', activeCategory = 'Juices';
        const money = n => `₹${Number(n || 0).toLocaleString('en-IN', { maximumFractionDigits: 2 })}`; const today = () => new Date().toISOString().slice(0, 10); const uid = p => p + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
        function openDB() { return new Promise((resolve, reject) => { const req = indexedDB.open('ledgerly-hotel', 1); req.onupgradeneeded = () => { const d = req.result;['menu', 'inventory', 'bills', 'bookings', 'expenses', 'settings'].forEach(s => { if (!d.objectStoreNames.contains(s)) d.createObjectStore(s, { keyPath: 'id' }) }) }; req.onsuccess = () => resolve(req.result); req.onerror = () => reject(req.error) }) }
        async function load() { render(); try { const response = await fetch(`${SHEET_WEBHOOK}?action=GET_ALL_DATA`); const remote = await response.json();['menu', 'inventory', 'bills', 'bookings', 'expenses'].forEach(store => { if (Array.isArray(remote[store]) && remote[store].length) db[store] = remote[store] }); } catch (e) { console.warn('Google Sheet unavailable; using starter data', e) } const known = new Set(db.menu.map(x => x.id)); const additions = photoMenu.filter(x => !known.has(x.id)); if (additions.length) { db.menu.push(...additions); pushToSheet() } render() }
        function persist(store, data) { db[store] = data; render(); pushToSheet() }
        function nav() { document.querySelectorAll('.nav-btn').forEach(b => b.onclick = () => { currentView = b.dataset.view; document.querySelectorAll('.nav-btn').forEach(x => x.classList.remove('nav-active')); b.classList.add('nav-active'); document.getElementById('pageTitle').textContent = b.textContent.trim(); render() }) }
        function render() { const c = document.getElementById('content'); c.innerHTML = currentView === 'dashboard' ? dashboard() : currentView === 'billing' ? billing() : currentView === 'inventory' ? inventory() : currentView === 'bookings' ? bookings() : expenses(); lucide.createIcons(); bind(); }
        function dashboard() { const revenue = db.bills.filter(x => x.date === today()).reduce((a, x) => a + x.total, 0), ex = db.expenses.filter(x => x.date === today()).reduce((a, x) => a + x.amount, 0), low = db.inventory.filter(x => x.godown + x.kitchen <= x.threshold).length; return `<div class="flex flex-col md:flex-row md:items-end justify-between gap-4 mb-7"><div><p class="text-sm text-[#e86b52] font-bold mb-1">Good morning, Muthu</p><h1 class="font-display text-3xl md:text-4xl font-bold tracking-tight">Your hotel, at a glance.</h1><p class="muted text-slate-500 mt-2 text-sm">${new Date().toLocaleDateString('en-IN', { weekday: 'long', day: 'numeric', month: 'long' })} · Everything is saved locally.</p></div><button onclick="switchView('billing')" class="btn-primary rounded-lg px-4 py-2.5 text-sm font-bold flex items-center gap-2 self-start"><i data-lucide="plus" class="w-4 h-4"></i>New bill</button></div><div class="grid grid-cols-2 xl:grid-cols-4 gap-3 mb-6"><div class="panel p-4"><div class="text-xs text-slate-500 mb-3">Today's sales</div><div class="font-display text-2xl font-bold">${money(revenue)}</div><div class="text-xs text-[#24755f] mt-2">${db.bills.filter(x => x.date === today()).length} bills raised</div></div><div class="panel p-4"><div class="text-xs text-slate-500 mb-3">Today's expenses</div><div class="font-display text-2xl font-bold">${money(ex)}</div><div class="text-xs text-slate-500 mt-2">Operating outflow</div></div><div class="panel p-4"><div class="text-xs text-slate-500 mb-3">Net collection</div><div class="font-display text-2xl font-bold">${money(revenue - ex)}</div><div class="text-xs text-[#24755f] mt-2">Before adjustments</div></div><div class="panel p-4 ${low ? 'border-[#f2bf72]' : ''}"><div class="text-xs text-slate-500 mb-3">Stock attention</div><div class="font-display text-2xl font-bold">${low}</div><div class="text-xs ${low ? 'text-[#bd6a1d]' : 'text-[#24755f]'} mt-2">${low ? 'Items below threshold' : 'All levels healthy'}</div></div></div><div class="grid xl:grid-cols-[1.4fr_1fr] gap-5"><section class="panel p-5"><div class="flex justify-between items-center mb-5"><div><h2 class="font-display font-bold text-lg">Today at the counter</h2><p class="text-xs text-slate-500 mt-1">Latest bills and payment modes</p></div><button onclick="switchView('billing')" class="text-xs font-bold text-[#e86b52]">Open POS →</button></div>${recentBills()}</section><section class="panel p-5"><div class="flex justify-between items-center mb-5"><div><h2 class="font-display font-bold text-lg">Stock pulse</h2><p class="text-xs text-slate-500 mt-1">Godown + kitchen snapshot</p></div><button onclick="switchView('inventory')" class="text-xs font-bold text-[#e86b52]">Manage →</button></div>${stockRows(4)}</section></div>` }
        function recentBills() { let rows = db.bills.slice(-5).reverse(); return rows.length ? `<div class="space-y-2">${rows.map(x => `<div class="flex justify-between items-center py-2 border-b border-slate-100 dark:border-slate-700"><div><div class="text-sm font-bold">${x.number || 'Bill'} <span class="font-normal text-slate-400">· ${x.payment}</span></div><div class="text-xs text-slate-500">${x.items?.length || 0} items · ${x.time || ''}</div></div><b class="text-sm">${money(x.total)}</b></div>`).join('')}</div>` : `<div class="text-center py-12 text-slate-400 text-sm">No bills yet today.<br><button onclick="switchView('billing')" class="text-[#e86b52] font-bold mt-2">Create your first bill →</button></div>` }
